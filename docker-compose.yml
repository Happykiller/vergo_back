# docker-compose.yml
services:
  vergo_back:
    build:
      dockerfile: Dockerfile
    container_name: vergo_back
    ports:
      - '3003:3000'
    restart: always
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./images:/usr/src/app/images
    networks:
      - interservices

networks:
  interservices:
    external: true